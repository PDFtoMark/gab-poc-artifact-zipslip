name: consumer

on:
  workflow_run:
    workflows:
      - bundle-size
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Context debug
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "head_sha=${{ github.event.workflow_run.head_sha }}"
          echo "head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "head_repo=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "prs=${{ toJSON(github.event.workflow_run.pull_requests) }}"
      - name: Checkout like the real workflow
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Which tree did we get
        run: |
          git log -1 --format='%H %s'
          ls -la
          echo "--- file check ---"
          test -f test/bundle/compare.mjs && echo "has test/bundle/compare.mjs" || echo "no compare.mjs here"
          test -f producer.sh && echo "has producer.sh (PR head)" || echo "no producer.sh (base)"
