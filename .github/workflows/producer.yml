name: bundle-size

on:
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build crafted report zip
        run: bash ./producer.sh
      - name: Upload crafted report artifact
        uses: ./.github/actions/raw-upload
        with:
          path: ${{ runner.temp }}/zipslip/report.zip
      - name: Show runner layout (debug)
        if: always()
        run: |
          ls -la /home/runner/work || true
          find /home/runner/work/_actions -maxdepth 3 -type d 2>/dev/null | head -20 || true
