name: bundle-size

on:
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload crafted report artifact
        run: bash ./producer.sh
      - name: Show runner layout (debug)
        if: always()
        run: |
          ls -la /home/runner/work || true
          ls -la /home/runner/work/_actions/actions/github-script/v9/dist 2>/dev/null | head -5 || true
