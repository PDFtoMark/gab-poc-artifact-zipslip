name: consumer

on:
  workflow_run:
    workflows:
      - bundle-size
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact (exactly like the target workflow)
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: bundle-size-report
          path: ${{ runner.temp }}/pnpm-audit-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for traversal escape
        if: always()
        run: |
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          ls -la "$RUNNER_TEMP" || true
          echo "--- extracted dir ---"
          ls -la "$RUNNER_TEMP/pnpm-audit-result" || true
          echo "--- escape marker ---"
          if [ -f "$RUNNER_TEMP/ZIPSLIP_ESCAPED.txt" ]; then
            echo "TRAVERSAL-ESCAPED-CONFIRMED"; cat "$RUNNER_TEMP/ZIPSLIP_ESCAPED.txt"
          else
            echo "NO-TRAVERSAL"
          fi
          echo "--- hijacked action dir ---"
          ls -la /home/runner/work/_actions/actions/github-script/*/dist 2>/dev/null | head -10 || true

      - name: Run github-script (attacker may have hijacked it)
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            console.log("ORIGINAL-GITHUB-SCRIPT-RAN");
